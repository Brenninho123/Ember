name: Build Ember OS

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: build
  ISO_DIR: isodir

jobs:
  build:
    name: Build Kernel and ISO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y nasm xorriso grub-pc-bin grub-common mtools build-essential gcc-multilib g++-multilib qemu-system-x86

      - name: Create build directory
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Assemble boot.asm
        run: nasm -f elf32 source/boot.asm -o ${{ env.BUILD_DIR }}/boot.o

      - name: Assemble Compile.asm
        run: nasm -f elf32 build/Compile.asm -o ${{ env.BUILD_DIR }}/compile.o

      - name: Compile Main.c
        run: gcc -m32 -c source/Main.c -o ${{ env.BUILD_DIR }}/main.o -std=gnu99 -ffreestanding -fno-pie -O2 -Wall -Wextra -Werror

      - name: Compile Kernel.c
        run: gcc -m32 -c source/ember/ui/Kernel.c -o ${{ env.BUILD_DIR }}/kernel.o -std=gnu99 -ffreestanding -fno-pie -O2 -Wall -Wextra -Werror

      - name: Compile Paths.c
        run: gcc -m32 -c source/ember/Paths.c -o ${{ env.BUILD_DIR }}/paths.o -std=gnu99 -ffreestanding -fno-pie -O2 -Wall -Wextra -Werror

      - name: Compile Content.c
        run: gcc -m32 -c source/ember/Content.c -o ${{ env.BUILD_DIR }}/content.o -std=gnu99 -ffreestanding -fno-pie -O2 -Wall -Wextra -Werror

      - name: Compile Controls.c
        run: gcc -m32 -c source/ember/input/Controls.c -o ${{ env.BUILD_DIR }}/controls.o -std=gnu99 -ffreestanding -fno-pie -O2 -Wall -Wextra -Werror

      - name: Compile USB.c
        run: gcc -m32 -c source/ember/connect/USB.c -o ${{ env.BUILD_DIR }}/usb.o -std=gnu99 -ffreestanding -fno-pie -O2 -Wall -Wextra -Werror

      - name: Link kernel
        run: |
          ld -m elf_i386 -T source/linker.ld -o ${{ env.BUILD_DIR }}/ember.bin \
            ${{ env.BUILD_DIR }}/boot.o \
            ${{ env.BUILD_DIR }}/compile.o \
            ${{ env.BUILD_DIR }}/main.o \
            ${{ env.BUILD_DIR }}/kernel.o \
            ${{ env.BUILD_DIR }}/paths.o \
            ${{ env.BUILD_DIR }}/content.o \
            ${{ env.BUILD_DIR }}/controls.o \
            ${{ env.BUILD_DIR }}/usb.o \
            -nostdlib

      - name: Verify multiboot compliance
        run: grub-file --is-x86-multiboot ${{ env.BUILD_DIR }}/ember.bin && echo "Multiboot confirmed"

      - name: Create ISO structure
        run: |
          mkdir -p ${{ env.ISO_DIR }}/boot/grub
          cp ${{ env.BUILD_DIR }}/ember.bin ${{ env.ISO_DIR }}/boot/ember.bin
          cat > ${{ env.ISO_DIR }}/boot/grub/grub.cfg << 'EOF'
          set timeout=5
          set default=0

          menuentry "Ember OS" {
              multiboot /boot/ember.bin
          }

          menuentry "Ember OS (safe mode)" {
              multiboot /boot/ember.bin safe_mode
          }
          EOF

      - name: Build ISO
        run: grub-mkrescue -o ${{ env.BUILD_DIR }}/ember.iso ${{ env.ISO_DIR }}

      - name: Smoke test in QEMU
        run: |
          timeout 15 qemu-system-i386 -cdrom ${{ env.BUILD_DIR }}/ember.iso -m 128 -display none -serial stdio || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ember-os-build
          path: |
            ${{ env.BUILD_DIR }}/ember.bin
            ${{ env.BUILD_DIR }}/ember.iso
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download ember.iso artifact
        uses: actions/download-artifact@v4
        with:
          name: ember-os-build
          path: build

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install QEMU build dependencies
        run: |
          sudo apt update
          sudo apt install -y ninja-build pkg-config libglib2.0-dev python3-venv

      - name: Set up Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build QEMU for Android ABIs
        run: |
          git clone --depth 1 --branch v8.2.0 https://gitlab.com/qemu-project/qemu.git qemu-src
          bash app/android/build-qemu-android.sh qemu-src android/app/src/main/jniLibs "$ANDROID_NDK_HOME"

      - name: Copy ember.iso into assets
        run: |
          mkdir -p android/app/src/main/assets
          cp build/ember.iso android/app/src/main/assets/ember.iso

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ember-launcher-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
